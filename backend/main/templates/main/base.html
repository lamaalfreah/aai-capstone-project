{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AAI Learning Agent | {% block title %}{% endblock %}</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>


  <style>
    :root {
      /*  Primary (Pink Gradient) */
      --primary-1: #feb2b4;
      --primary-2: #ec8079;
  
      /* 🔵 Secondary (Blue) */
      --secondary: #5ab3ee;
  
      /* 🌿 Background */
      --bg-soft: #fdf0e1;
  
      /* 🎯 Text */
      --dark: #2c2c2c;
    }
  
    html, body { margin: 0; padding: 0; }
  
    body {
      background: var(--bg-soft);
    }
  
    .glass-card {
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.45);
    }
  
    /* 🔥 Gradient Button */
    .btn-primary {
      background: linear-gradient(135deg, var(--primary-1), var(--primary-2));
      color: white;
    }
  
    .btn-primary:hover {
      opacity: 0.9;
    }
  
    /* 🔵 Secondary Button */
    .btn-secondary {
      background: var(--secondary);
      color: white;
    }
  </style>
</head>

<body class="font-[Cairo] min-h-screen relative overflow-x-hidden text-gray-900">

  <nav class="border-b border-gray-200 bg-white/70 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-6xl flex flex-wrap items-center justify-between mx-auto p-4">
      <a href="{% url 'main:home_view' %}" class="flex items-center gap-2">
        <img src="{% static 'images/logo.png' %}" 
        class="h-18 w-auto object-contain" 
        alt="Logo">
      </a>
      <button data-collapse-toggle="navbar-default" type="button"
        class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm rounded-lg lg:hidden hover:bg-gray-100"
        aria-controls="navbar-default" aria-expanded="false">
        <span class="sr-only">Open main menu</span>
        <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 17 14">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 1h15M1 7h15M1 13h15"/>
        </svg>
      </button>

      <div class="hidden w-full lg:block lg:w-auto" id="navbar-default">
        <ul class="flex flex-col p-4 lg:p-0 mt-4 border border-gray-200 rounded-lg lg:flex-row lg:gap-6 lg:mt-0 lg:border-0 lg:bg-transparent">
          <li>
            <a href="{% url 'main:home_view' %}" class="block py-2 px-3 hover:text-[var(--primary-2)] {% if request.resolver_match.url_name == 'home_view' %}font-bold text-[#ec8079]{% endif %}">الرئيسية</a>
          </li>
          <li>
            <a href="{% url 'learning_test:start' %}" class="block py-2 px-3 hover:text-[var(--primary-2)] {% block learning_test_nav %}{% endblock %}">اختبار نمط التعلم</a>
          </li>
          <li>
            <a href="{% url 'agent_chat:chat' %}" class="block py-2 px-3 hover:text-[var(--primary-2)] {% block agent_nav %}{% endblock %}">المساعد الذكي</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="fixed inset-0 -z-10 flex items-end justify-center pointer-events-none">

    <div class="absolute bottom-0 left-[10%] w-[330px] h-[330px] rounded-full blur-[150px] opacity-60"
         style="background:#5ab3ee;"></div>
  
    <div class="absolute bottom-5 left-1/2 -translate-x-1/2 w-[430px] h-[430px] rounded-full blur-[170px] opacity-60"
         style="background:#feb2b4;"></div>
  
    <div class="absolute bottom-0 right-[10%] w-[330px] h-[330px] rounded-full blur-[150px] opacity-60"
         style="background:#ec8079;"></div>
  
  </div>
  <main class="min-h-[calc(100vh-73px)] {% block background %}{% endblock %}">
    <div class="w-full max-w-6xl mx-auto px-4">
      {% include 'main/components/messages.html' %}
      {% block content %}{% endblock %}
    </div>
  </main>

</body>
</html>
